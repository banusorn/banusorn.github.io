//ENGINE
const H=v=>v==null||v>=1.4?1:0;
const SEG=['1111110','0110000','1101101','1111001','0110011','1011011','1011111','1110000','1111111','1111011'];
const I=(nm,o)=>({nm,...o});
const quad=(f,G)=>({n:14,v:14,g:7,G,ev:c=>G.forEach(([a,b,y])=>c.o(y,f(c.i(a),c.i(b))))});

const ff=(c,k,ck,cl,pr,Q,N,f,ed)=>{const s=c.s,e=c.edge(ck);let q=s['q'+k]||0;if(!c.i(cl))q=0;else if(!c.i(pr))q=1;else if(e==ed)q=f(q);s['q'+k]=q;c.o(Q,q);c.o(N,1-q)};

'7483':I('Adder 4 บิต',{n:16,v:5,g:12,L:'A4 S3 A3 B3 - S2 B2 A2 S1 A1 B1 - C0 C4 S4 B4',ev:c=>{const t=bits(c,[10,8,3,1])+bits(c,[11,7,4,16])+c.i(13);[9,6,2,15].forEach((p,k)=>c.o(p,t>>k&1));c.o(14,t>>4&1)}}),
'7485':I('Comparator 4 บิต',{n:16,v:16,g:8,L:'B3 A<Bi A=Bi A>Bi A>B A=B A<B - B0 A0 B1 A1 A2 B2 A3',ev:c=>{const a=bits(c,[10,12,13,15]),b=bits(c,[9,11,14,1]),e=a==b;c.o(5,a>b||(e&&c.i(4)));c.o(6,e&&c.i(3));c.o(7,a<b||(e&&c.i(2)))}}),
'74148':I('Priority Enc 8→3',{n:16,v:16,g:8,L:'4 5 6 7 EI A2 A1 - A0 0 1 2 3 GS EO',ev:c=>{let k=-1;[10,11,12,13,1,2,3,4].forEach((p,j)=>{if(!c.i(p))k=j});if(c.i(5)){[9,7,6,14,15].forEach(p=>c.o(p,1))}else{const y=k<0?7:7-k;[9,7,6].forEach((p,j)=>c.o(p,y>>j&1));c.o(14,k<0);c.o(15,k>=0)}}}),

'74151':I('MUX 8:1',{n:16,v:16,g:8,L:'D3 D2 D1 D0 Y W E - C B A D7 D6 D5 D4',ev:c=>{const d=c.i([4,3,2,1,15,14,13,12][bits(c,[11,10,9])]),y=c.i(7)?0:d;c.o(5,y);c.o(6,1-y)}}),
'7474':I('Dual D-FF',{n:14,v:14,g:7,L:'CLR1 D1 CK1 PR1 Q1 Q1’ - Q2’ Q2 PR2 CK2 D2 CLR2',ev:c=>{ff(c,0,3,1,4,5,6,()=>c.i(2),1);ff(c,1,11,13,10,9,8,()=>c.i(12),1)}}),
'7476':I('Dual JK-FF (ขอบตก)',{n:16,v:5,g:13,L:'CK1 PR1 CLR1 J1 - CK2 PR2 CLR2 J2 Q2’ Q2 K2 - Q1’ Q1 K1',ev:c=>{const jk=(j,k)=>q=>j&k?1-q:j?1:k?0:q;ff(c,0,1,3,2,15,14,q=>jk(c.i(4),c.i(16))(q),-1);ff(c,1,6,8,7,11,10,q=>jk(c.i(9),c.i(12))(q),-1)}}),
'555':I('Timer (Astable)',{n:8,v:8,g:1,L:'GND TRG OUT RST CTL THR DIS VCC',ev:c=>{c.s.ok=c.same(2,6);c.o(3,c.i(4)&&c.s.ok?(c.s.o|0):0)}}),
'7490':I('Decade Counter',{n:14,v:5,g:10,L:'CKB R01 R02 - - R91 R92 QC QB - QD QA - CKA',ev:c=>{const s=c.s,ea=c.edge(14),eb=c.edge(1);s.a=s.a||0;s.b=s.b||0;
 if(c.i(6)&&c.i(7)){s.a=1;s.b=4}else if(c.i(2)&&c.i(3)){s.a=0;s.b=0}else{if(ea==-1)s.a^=1;if(eb==-1)s.b=(s.b+1)%5}
 c.o(12,s.a);c.o(9,s.b&1);c.o(8,s.b>>1&1);c.o(11,s.b>>2&1)}}),
'74161':I('Counter 4 บิต',{n:16,v:16,g:8,L:'CLR CLK A B C D ENP - LD ENT QD QC QB QA RCO',ev:c=>{const s=c.s,e=c.edge(2);let n=s.n||0;if(!c.i(1))n=0;else if(e==1){if(!c.i(9))n=bits(c,[3,4,5,6]);else if(c.i(7)&&c.i(10))n=(n+1)&15}
 s.n=n;[14,13,12,11].forEach((p,k)=>c.o(p,n>>k&1));c.o(15,n==15&&c.i(10))}}),
'74194':I('Universal Shift Reg',{n:16,v:16,g:8,L:'CLR SR A B C D SL - S1 S0 CLK QD QC QB QA',ev:c=>{const s=c.s,e=c.edge(11);let q=s.q||0;if(!c.i(1))q=0;else if(e==1){const m=c.i(9)<<1|c.i(10);
 if(m==3)q=bits(c,[3,4,5,6]);else if(m==1)q=((q<<1)&14)|c.i(2);else if(m==2)q=(q>>1)|c.i(7)<<3}
 s.q=q;[15,14,13,12].forEach((p,k)=>c.o(p,q>>k&1))}}),
'7489':I('RAM 16×4 (เอาต์พุตกลับค่า)',{n:16,v:16,g:8,L:'A0 ME WE D1 O1 D2 O2 - O3 D3 O4 D4 A3 A2 A1',ev:c=>{const m=c.s.m=c.s.m||Array(16).fill(0),a=bits(c,[1,15,14,13]),d=bits(c,[4,6,10,12]),O=[5,7,9,11];
 if(c.i(2))O.forEach(p=>c.o(p,1));else{if(!c.i(3))m[a]=d;O.forEach((p,k)=>c.o(p,1-((c.i(3)?m[a]:d)>>k&1)))}}}),
'ROM':I('ROM 16×4 (จำลอง)',{n:16,v:16,g:8,L:'A0 A1 A2 A3 CE Q1 Q2 - Q3 Q4',ev:c=>{const d=[1,2,4,8,4,2,1,0,3,6,12,9,15,0,5,10][bits(c,[1,2,3,4])];[6,7,9,10].forEach((p,k)=>c.o(p,!c.i(5)&&d>>k&1))}}),
'4N25':I('Optocoupler',{n:4,v:0,g:0,L:'IN - - OUT',ev:c=>c.o(4,c.i(1))})};
const lab=D=>{const a=Array(D.n).fill('');if(D.G)D.G.forEach((g,k)=>g.forEach((p,j)=>a[p-1]=(k+1)+(g.length==2?'AY':'ABY')[j]));else D.L.split(' ').forEach((x,i)=>a[i]=x=='-'?'':x);if(D.v)a[D.v-1]='VCC';if(D.g)a[D.g-1]='GND';return a};
function solve(P,W){
 const par={},f=k=>{if(par[k]===undefined)par[k]=k;while(par[k]!==k){par[k]=par[par[k]];k=par[k]}return k};
 W.forEach(w=>{par[f(w[0]+'.'+w[1])]=f(w[2]+'.'+w[3])});
 let nv={},err={};
 for(let it=0;it<40;it++){
  nv={};err={};
  P.forEach(p=>{for(const k in p.out){const v=p.out[k],r=f(p.id+'.'+k);if(nv[r]===undefined)nv[r]=v;else if(nv[r]!==v)err[r]=1}});
  let ch=0;
  P.forEach(p=>{const D=IC[p.type];if(!D)return;
   const val=k=>{const r=f(p.id+'.'+k);return err[r]?null:nv[r]},
   c={s:p.st,v:val,i:k=>H(val(k)),o:(k,b)=>{p.out[k]=b?5:0},same:(a,b)=>f(p.id+'.'+a)===f(p.id+'.'+b),
   edge:k=>{const pc=p.st.pc=p.st.pc||{};if(val(k)==null){delete pc[k];return 0}const cu=c.i(k),pr=pc[k]??cu;pc[k]=cu;return pr==cu?0:cu?1:-1}};
   const b4=JSON.stringify(p.out);p.out={};
   p.st.pw=!D.v||(val(D.v)>=4&&val(D.g)<=.8);
   if(p.st.pw)D.ev(c);
   if(JSON.stringify(p.out)!=b4)ch=1});
  if(!ch)break}
 P.forEach(p=>{if(p.type=='RELAY'){const r=f(p.id+'.1'),on=!err[r]&&nv[r]>=2;if(p.st.on&&!on&&!p.props.d)p.st.sp=Date.now();p.st.on=on?1:0}});
 return{nv,err,f}}
//END

 SEG:{w:130,h:130,p:[...'abcdefg'].map((l,k)=>[k+1,0,14+k*16,l])}};

{t:'ลอจิกเกตพื้นฐาน',h:'3/12/15',pal:['7408','7432','7404','7400','7402','7486'],s:['วาง IC, +5V, GND แล้วต่อ VCC และ GND เข้าขาจ่ายไฟของ IC (7408/7400: ขา 14 และ 7) ถ้าไม่ต่อ IC จะไม่ทำงาน','ต่อสวิตช์เข้าอินพุตและเอาต์พุตเข้า LED แล้วบันทึกตารางความจริง AND, OR, NOT, NAND, NOR, XOR','ใช้ 7400 (NAND) ล้วนสร้าง NOT, AND และ OR (Universal Gate)','สังเกต: ขาอินพุตที่ปล่อยลอยจะอ่านเป็น 1 (TTL)'],p:'แผงวงจรทดสอบลอจิกเกตพื้นฐาน + ตารางบันทึกผล'},

computed:{B(){return this.bds[this.i]},parts(){return this.B.parts},wires(){return this.B.wires},cur(){return this.U[this.i]},
 pal(){return[...COM,...this.cur.pal]},selP(){return this.parts.find(p=>p.id==this.sel)},
 f555(){const r=this.selP.props;return(1440/((r.r1+2*r.r2)*r.c)).toFixed(2)},d555(){const r=this.selP.props;return(100*(r.r1+r.r2)/(r.r1+2*r.r2)).toFixed(1)}},
watch:{i(){this.sel=null;this.pend=null;this.solve()}},

methods:{
 solve(){const r=solve(this.parts,this.wires);PAR=r.f;this.nv=r.nv;this.err=r.err},
 val(id,k){const r=PAR(id+'.'+k);return this.err[r]?null:this.nv[r]},
 lbl(t){return IC[t]?t+' '+IC[t].nm:LB[t]},
 G(p){const g=GEO[p.type];if(g)return{w:g.w,h:g.h,pins:g.p.map(([n,x,y,l])=>({n,x,y,l:l||''}))};
  const D=IC[p.type],L=lab(D),W=130,h=D.n/2,pins=[];for(let n=1;n<=D.n;n++)pins.push(n<=h?{n,x:0,y:40+(n-1)*18,l:L[n-1]}:{n,x:W,y:40+(D.n-n)*18,l:L[n-1]});return{w:W,h:44+h*18,pins}},
 title(p){const t=p.type;return IC[t]?t+' '+IC[t].nm:t=='SW'?'SW '+p.st.v:t=='CLK'?'CLK '+p.props.hz+'Hz':t=='SENS'?'เซนเซอร์ '+p.props.v+'V':t=='RELAY'?'รีเลย์+หลอด':t=='LED'?'':t=='VCC'?'+5V':t=='SEG'?'7-SEG':t},
 lb(p,q){return IC[p.type]?(q.x==0?q.n+' '+q.l:q.l+' '+q.n):q.l},
 pt(id,n){const p=this.parts.find(x=>x.id==id);if(!p)return[0,0];const q=this.G(p).pins.find(x=>x.n==n);return[p.x+q.x,p.y+q.y]},
 path(w){const a=this.pt(w[0],w[1]),b=this.pt(w[2],w[3]);return`M${a[0]} ${a[1]}C${a[0]+50} ${a[1]} ${b[0]-50} ${b[1]} ${b[0]} ${b[1]}`},
 wc(w){if(this.err[PAR(w[0]+'.'+w[1])])return'var(--bad)';const v=this.val(w[0],w[1]);return v==null?'var(--wo)':v>=2?'var(--on)':'#64748b'},
 hi(p){const v=this.val(p.id,1);return v!=null&&v>=2},
 sg(p,k){const v=this.val(p.id,k+1);return v!=null&&v<=.8},
 spk(p){return p.st.sp&&Date.now()-p.st.sp<2500},
 add(t){const n=++this.B.n;this.parts.push(mk(t,30+(n%7)*28,20+(n%9)*34,n));this.solve()},
 demo(){const r=PRE[this.i]();this.B.parts=r.parts;this.B.wires=r.wires;this.B.n=r.n;this.sel=null;this.pend=null;this.solve()},
 clear(){this.B.parts=[];this.B.wires=[];this.sel=null;this.pend=null;this.solve()},
 del(){const id=this.sel;this.B.wires=this.wires.filter(w=>w[0]!=id&&w[2]!=id);this.B.parts=this.parts.filter(p=>p.id!=id);this.sel=null;this.solve()},
 xy(e){const s=this.$refs.sv,pt=s.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const m=pt.matrixTransform(s.getScreenCTM().inverse());return[m.x,m.y]},
 dn(e,p){const[x,y]=this.xy(e);this.sel=p.id;this.drag={p,ox:x-p.x,oy:y-p.y,sx:x,sy:y,m:0}},
 mv(e){const[x,y]=this.xy(e);this.mp=[x,y];const d=this.drag;if(!d)return;if(Math.abs(x-d.sx)+Math.abs(y-d.sy)>4)d.m=1;if(d.m){d.p.x=Math.max(0,Math.round(x-d.ox));d.p.y=Math.max(0,Math.round(y-d.oy))}},
 up(){const d=this.drag;this.drag=null;if(!d||d.m)return;const p=d.p;
  if(p.type=='SW'){p.st.v^=1;p.out[1]=p.st.v?5:0;this.solve()}
  else if(p.type=='PB'){p.st.v=1;p.out[1]=5;this.solve();setTimeout(()=>{p.st.v=0;p.out[1]=0;this.solve()},250)}},
 pc(p,n){if(!this.pend)this.pend=[p.id,n];else{if(this.pend[0]!=p.id||this.pend[1]!=n){this.wires.push([...this.pend,p.id,n]);this.solve()}this.pend=null}},
 setV(v){const p=this.selP;p.props.v=+v;p.out[1]=+v;this.solve()},
 chk(){const i=this.i,ns=x=>String(x).replace(/\s+/g,'').toLowerCase();
  this.res[i]=LAB[i].items.map((it,k)=>{const v=ns(this.ans[i][k]);if(it.n!=null){const x=parseFloat(v);return!isNaN(x)&&Math.abs(x-it.n)<=it.t}return it.a.some(a=>ns(a)==v)});
  this.pass[i]=this.res[i].every(Boolean);this.save()},
 score(i){return this.res[i]?this.res[i].filter(Boolean).length:0},
 save(){try{localStorage.setItem('dlp',JSON.stringify({pass:this.pass,st:this.st}))}catch(e){}},
 thDate(){return new Date().toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'})},
 prn(){window.print()},
 tick(){let ch=0;this.parts.forEach(p=>{
  if(p.type=='CLK'){p.st.t=(p.st.t||0)+100;if(p.st.t>=500/p.props.hz){p.st.t=0;p.st.on^=1;p.out[1]=p.st.on?5:0;ch=1}}
  if(p.type=='555'&&p.st.pw&&p.st.ok){const r=p.props,th=.693*(r.r1+r.r2)*r.c,tl=.693*r.r2*r.c;p.st.t=(p.st.t||0)+100;if(p.st.t>=Math.max(p.st.o?th:tl,100)){p.st.t=0;p.st.o=(p.st.o||0)^1;ch=1}}});
  if(ch)this.solve()}},

<div class="card rounded-xl border-l-4 border-l-ac shadow-sm"><b class="text-ac">ขั้นตอนการทดลอง</b><ol class="mt-1 list-decimal space-y-1 pl-5 text-sm"><li v-for="s in cur.s" :key="s">{{s}}</li></ol></div>
<div class="row"><b>ชิ้นส่วน:</b><button class="btn g rounded-full px-3 py-1 text-sm shadow-sm transition hover:bg-ac hover:text-white" v-for="t in pal" :key="t" @click="add(t)">+ {{lbl(t)}}</button></div>
<div class="row"><button class="btn rounded-lg px-4 py-1.5 font-medium shadow transition hover:opacity-90" @click="demo">โหลดวงจรตัวอย่าง</button><button class="btn g rounded-lg px-4 py-1.5 transition hover:bg-red-500 hover:text-white" @click="clear">ล้างบอร์ด</button>
<span class="mu">คลิกขา → คลิกขาปลายทางเพื่อต่อสาย · คลิกสายเพื่อลบ · ลากเพื่อย้าย · คลิกสวิตช์เพื่อสลับ · สายเขียว=1 เทา=0 ส้ม=ลอย แดง=ลัดวงจร</span></div>
<div class="scroll rounded-xl shadow-md"><svg ref="sv" class="board" viewBox="0 0 980 620" width="980" height="620" @pointermove="mv" @pointerup="up" @pointerleave="up" @click="pend=null;sel=null">
<g v-for="(w,k) in wires" :key="k" @click.stop="wires.splice(k,1);solve()"><path class="w" :d="path(w)" :stroke="wc(w)"><title>คลิกเพื่อลบสาย</title></path></g>
<line v-if="pend" :x1="pt(pend[0],pend[1])[0]" :y1="pt(pend[0],pend[1])[1]" :x2="mp[0]" :y2="mp[1]" stroke="var(--ac)" stroke-dasharray="5 4" stroke-width="2"/>
<g v-for="p in parts" :key="p.id" :transform="'translate('+p.x+','+p.y+')'" :class="{sel:sel==p.id}" @pointerdown.stop="dn($event,p)" @click.stop>
<rect class="body" :class="{on:p.st.v==1||p.st.on==1}" :width="G(p).w" :height="G(p).h" rx="6"/>
<text class="t" x="6" y="16">{{title(p)}}</text>
<circle v-if="p.type=='LED'" cx="26" cy="13" r="8" :class="['lc',{on:hi(p)}]"/>
<circle v-if="p.type=='RELAY'" cx="100" cy="28" r="12" :class="['lc',{on:hi(p)}]"/>
<text v-if="p.type=='RELAY'&&spk(p)" class="t wt" x="6" y="50">⚡ แรงดันพุ่ง!</text>
<text v-if="IC[p.type]&&!p.st.pw" class="t wt" x="6" y="30">ไม่มีไฟเลี้ยง</text>
<g v-if="p.type=='SEG'" transform="translate(64,12) scale(.9)"><rect v-for="(r,k) in R7" :key="k" :x="r[0]" :y="r[1]" :width="r[2]" :height="r[3]" rx="3" :class="['sg',{on:sg(p,k)}]"/></g>
<g v-for="q in G(p).pins" :key="q.n"><circle class="pin" :class="{hot:pend&&pend[0]==p.id&&pend[1]==q.n}" :cx="q.x" :cy="q.y" r="5" @pointerdown.stop @click.stop="pc(p,q.n)"/>
<text class="l" :x="q.x?q.x-9:9" :y="q.y+3" :text-anchor="q.x?'end':'start'">{{lb(p,q)}}</text></g></g></svg></div>
<section v-if="selP"><div class="row"><b>{{title(selP)||selP.type}}</b><button class="btn g" @click="del">ลบชิ้นส่วน</button>
<template v-if="selP.type=='555'"><label>R1 <input type="number" min="0.1" step="0.1" v-model.number="selP.props.r1"> kΩ</label><label>R2 <input type="number" min="0.1" step="0.1" v-model.number="selP.props.r2"> kΩ</label><label>C <input type="number" min="0.1" step="0.1" v-model.number="selP.props.c"> µF</label><b>f ≈ {{f555}} Hz · Duty {{d555}}%</b><span class="mu">(ต้องต่อขา 2 กับ 6 เข้าด้วยกัน)</span></template>
<label v-if="selP.type=='SENS'">แรงดัน <input type="range" min="0" max="5" step="0.1" :value="selP.props.v" @input="setV($event.target.value)"> {{selP.props.v}} V</label>
<label v-if="selP.type=='CLK'">ความถี่ <select v-model.number="selP.props.hz"><option>1</option><option>2</option><option>4</option></select> Hz</label>
<label v-if="selP.type=='RELAY'"><input type="checkbox" :checked="selP.props.d" @change="selP.props.d=+$event.target.checked"> มีไดโอด Flyback</label></div></section>
<section class="card rounded-xl border-l-4 border-l-ac shadow-sm"><h3 class="text-lg font-bold">แล็บเติมคำ หน่วยที่ {{i+1}} {{cur.t}}</h3>
<p class="text-sm text-mu">ทดลองบนบอร์ดด้านบน แล้วเติมคำตอบจากผลที่ได้จริง ({{LAB[i].note}}) ตอบถูกครบทุกข้อจึงผ่านและพิมพ์เกียรติบัตรได้</p>
<div class="row"><label>ชื่อ-สกุล <input class="li" style="width:230px" v-model="st.name" @change="save"></label><label>ชั้น/กลุ่ม <input class="li" style="width:100px" v-model="st.grp" @change="save"></label><label>เลขที่ <input class="li" style="width:60px" v-model="st.no" @change="save"></label></div>
<ol class="list-decimal space-y-2 pl-6"><li v-for="(it,k) in LAB[i].items" :key="k">{{it.q}} <input class="li" :class="res[i]?(res[i][k]?'ok':'no'):''" v-model="ans[i][k]" @input="res[i]=null;pass[i]=false"> <b v-if="res[i]" :class="res[i][k]?'text-green-600':'warn'">{{res[i][k]?'✓':'✗ ลองใหม่'}}</b></li></ol>
<div class="row"><button class="btn rounded-lg px-4 py-1.5 font-medium shadow" @click="chk">ตรวจคำตอบ</button><span v-if="res[i]">ได้ {{score(i)}}/{{LAB[i].items.length}} ข้อ</span>
<template v-if="pass[i]"><b class="ok">🎉 ผ่านแล้ว</b><button class="btn rounded-lg px-4 py-1.5 font-medium shadow" :disabled="!st.name.trim()" @click="cert=i">🖨 ออกเกียรติบัตร</button><span v-if="!st.name.trim()" class="warn">กรอกชื่อ-สกุลก่อน</span></template></div></section>
</main>
<div v-if="cert!==null" class="certwrap"><div class="noprint bar"><button class="btn" @click="prn">🖨 พิมพ์ / บันทึกเป็น PDF</button><button class="btn g" @click="cert=null">ปิด</button></div>
